<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Masking for PDPA</title>
  <link rel="stylesheet" href="/static/style2.css">
</head>
<body>
  <main class="workspace">
    <h1>Data Masking for PDPA</h1>

    <section class="panel input-panel" aria-labelledby="input-heading">
      <h2 id="input-heading" class="input-heading">Input</h2>
      <label for="raw-text">RAW TEXT</label>
      <div class="textarea-wrap">
        <textarea id="raw-text" spellcheck="false" placeholder="Enter or paste raw text stream (e.g. Card: 4532–7566–8921–4322, Email: somchai.c@company.co.th, Phone: 089–123–4567, DOB: 25/12/2540, Address: 689 ซอยลาดกระบัง 19 กรุงเทพฯ…)"></textarea>
        <button class="example-button" type="button">+ Example Data</button>
      </div>
      <div class="import-image">
        <label for="image-file">IMPORT IMAGE</label>
        <div class="upload-area">
          <span class="image-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
              <circle cx="14.5" cy="9.5" r="1"/>
              <path d="m5 15 4-4 4 4 2-2 4 4"/>
            </svg>
          </span>
          <div class="upload-description">
            <span class="upload-title">อัปโหลด / ลากไฟล์รูปภาพ</span>
            <span class="upload-hint" id="file-hint">JPG, PNG, WEBP หรือ PDF (สูงสุด 10MB)</span>
          </div>
          <div class="file-picker">
            <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" aria-label="เลือกรูปภาพ" aria-describedby="file-hint">
            <span class="upload-button" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 17a4 4 0 0 1-1-7.9A7 7 0 0 1 18.5 8a4.5 4.5 0 0 1 .5 9M12 20V10m-4 4 4-4 4 4"/>
              </svg>
              เลือกรูปภาพ
            </span>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="button button-outline" type="button">Clear</button>
      <button class="button button-primary" type="button">Mask</button>
    </div>

    <section class="panel output-panel" aria-labelledby="output-heading">
      <div class="output-header">
        <h2 id="output-heading">Output</h2>
        <button class="copy-button" type="button">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor"/>
            <path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9A1.5 1.5 0 0 0 3.5 10.5H5" stroke="currentColor"/>
          </svg>
          Copy Output
        </button>
      </div>
      <pre class="output" aria-live="polite">&gt; Awaiting data stream...</pre>
    </section>
  </main>
</body>
</html>
