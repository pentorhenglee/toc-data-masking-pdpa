<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Masking for PDPA</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="workspace">
    <h1>Data Masking for PDPA</h1>

    <form method="post">
      <section class="panel input-panel" aria-labelledby="input-heading">
        <h2 id="input-heading" class="input-heading">Input</h2>
        <label for="raw-text">RAW TEXT</label>
        <div class="textarea-wrap">
          <textarea id="raw-text" name="text" spellcheck="false" placeholder="Enter or paste raw text stream (e.g. Card: 4532–7566–8921–4322, Email: somchai.c@company.co.th, Phone: 089–123–4567, DOB: 25/12/2540, Address: 689 ซอยลาดกระบัง 19 กรุงเทพฯ…)">{{ text }}</textarea>
          <button class="example-button" type="button">+ Example Data</button>
        </div>
      </section>
  
      <div class="actions">
        <a class="button button-outline" href="/" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">Clear</a>
        <button class="button button-primary" type="submit">Mask</button>
      </div>
    </form>

    <section class="panel output-panel" aria-labelledby="output-heading">
      <div class="output-header">
        <h2 id="output-heading">Output</h2>
        <button class="copy-button" type="button">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor"/>
            <path d="M10.5 5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9A1.5 1.5 0 0 0 3.5 10.5H5" stroke="currentColor"/>
          </svg>
          Copy Output
        </button>
      </div>
      <pre class="output" aria-live="polite">{{ result }}</pre>
    </section>
  </main>
</body>
</html>
